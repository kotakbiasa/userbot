[project]
name = "selfbot"
version = "2025.11.4"
description = "Telegram Selfbot with PyroTgFork [Pyrogram Fork]"
readme = "README.md"
keywords = [
    "selfbot",
    "telegram",
    "mtproto",
    "pyrogram"
]
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "aiorun (>=2025.1.1,<2026.0.0)",
    "asyncpg (>=0.30.0,<1.0.0)",
    "gitpython (>=3.1.45,<4.0.0)",
    "httpx (>=0.28.1,<1.0.0)",
    "pyrotgfork (>=2.2.16,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "telegraph[aio] (>=2.2.0,<3.0.0)"
]

[[project.authors]]
name = "DeltaUniverse <deltauniverse@github.org>"

[project.scripts]
selfbot = "selfbot.main:run"

[project.optional-dependencies]
speedups = [
    "pytgcrypto (>=1.2.11,<2.0.0)",
    "uvloop (>=0.21.0,<1.0.0)"
]
pytgcalls = ["py-tgcalls (>=2.2.8,<3.0.0)"]

[build-system]
requires = ["poetry-core>=2.2.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = ">=2.0"
