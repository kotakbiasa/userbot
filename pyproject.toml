[project]
name = "selfbot"
version = "2025.10.8"
description = "Telegram Selfbot with PyroTgFork [Pyrogram Fork]"
readme = "README.md"
keywords = [
    "selfbot",
    "telegram",
    "mtproto",
    "pyrogram"
]
classifiers = [
    "Environment :: Console",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications",
    "Topic :: Communications :: Chat"
]

[[project.authors]]
name = "DeltaUniverse <deltauniverse@github.org>"

[project.license]
text = "MIT"

[build-system]
requires = ["poetry-core>=2.2.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
selfbot = "selfbot.main:run"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
aiorun = ">=2025.1.1,<2026.0.0"
asyncpg = ">=0.30.0,<1.0.0"
gitpython = ">=3.1.45,<4.0.0"
httpx = ">=0.28.1,<1.0.0"
pyrotgfork = ">=2.2.16,<3.0.0"
python-dotenv = ">=1.1.1,<2.0.0"

[tool.poetry.dependencies.telegraph]
version = ">=2.2.0,<3.0.0"
extras = ["aio"]

[tool.poetry.dependencies.py-tgcalls]
version = ">=2.2.8,<3.0.0"
optional = true

[tool.poetry.dependencies.pytgcrypto]
version = ">=1.2.11,<2.0.0"
optional = true

[tool.poetry.dependencies.uvloop]
version = ">=0.21.0,<1.0.0"
optional = true

[tool.poetry.extras]
pytgcalls = ["py-tgcalls"]
speedups = ["pytgcrypto", "uvloop"]
