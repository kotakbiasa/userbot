[project]
name = "selfbot"
version = "2025.12.22"
description = "Telegram Selfbot"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiorun>=2025.1.1,<2026.0.0",
    "asyncpg==0.31.0",
    "gallery-dl>=1.30.10,<1.40.0",
    "gitpython>=3.1.45,<4.0.0",
    "httpx[http2]==0.28.1",
    "instaloader>=4.15,<5.0",
    "pillow>=10.4.0,<11.0.0",
    "psutil>=7.1.3,<8.0.0",
    "py-tgcalls==2.2.8",
    "py-yt-search>=0.5.3,<1.0.0",
    "pyrotgfork==2.2.17",
    "pytgcrypto==1.2.11",
    "python-dotenv==1.2.1",
    "speedtest-cli>=2.1.3,<3.0.0",
    "telegraph[aio]==2.2.0",
    "uvloop==0.22.1",
    "validators>=0.35.0,<0.36.0",
    "yt-dlp>=2025.11.12,<2026.0.0",
]

[project.scripts]
selfbot = "selfbot.main:run"

[tool.uv]
package = true
